zstack_build_root=/workspace
build_version=master
product.name=ZStack-ZSphere
product.bin.name=ZStack-ZSphere-installer

# Build premium war and package prebuilt external runtime artifacts.
# Commercial/premium: keep build_war_flag set (e.g. premium) so agent/store/network/etc are packaged.
# Open-source: leave build_war_flag unset (use build.oss.xml instead).
build_war_flag=premium
build.zstack.premium.war=true
# CI overrides this property with -Dzsv.edition=true for enterprise builds.
zsv.edition=false
# Same as build.xml: enable UI packaging (imports build.ui.entry and produces zstack_ui.bin).
build.zstack.ui=true

# Used to copy mkiso/.repo_version (zsv.edition=true), zsphere_config/version, and external-*.tar version.
zstack.distro.source=${zstack_build_root}/zstack-distro

zstack.source=${zstack_build_root}/zsvirt
zstack.build_version=${build_version}
zsha2.version=3.9.0.0

zstackutility.source=${zstack_build_root}/zsvirt-utility
zstackutility.build_version=${build_version}

apachetomcat.pkg=${zstack_build_root}/apache-tomcat-8.5.99.zip

zstackdashboard.source=${zstack_build_root}/zstack-dashboard
zstackdashboard.build_version=${build_version}

zstacklib.source=${zstack_build_root}/zsvirt-utility/zstacklib
zstackcli.source=${zstack_build_root}/zsvirt-utility/zstackcli
zstackbuild.scripts=${zstack_build_root}/zsvirt-utility/zstackbuild/scripts

# For UI 2.0 (same as build.properties / build.xml)
zstack.ui.source=${zstack_build_root}/zstack-ui
build.ui.bin=${zstack_build_root}/zstack-ui/zstack-ui-server/buildtmp/zstack_ui.bin
build.ui.entry=${zstack_build_root}/zstack-ui/zstack-ui-server

apibinding.source=${zstack_build_root}/zsvirt-utility/apibinding

kvmagent.source=${zstack_build_root}/zsvirt-utility/kvmagent
kvmagent.serviceFile=${zstack_build_root}/zsvirt-utility/kvmagent/zstack-kvmagent

sftpbackupstorage.source=${zstack_build_root}/zsvirt-utility/sftpbackupstorage
sftpbackupstorage.serviceFile=${zstack_build_root}/zsvirt-utility/sftpbackupstorage/zstack-sftpbackupstorage

appliancevm.source=${zstack_build_root}/zsvirt-utility/appliancevm
appliancevm.serviceFile=${zstack_build_root}/zsvirt-utility/appliancevm/zstack-appliancevm

virtualrouter.source=${zstack_build_root}/zsvirt-utility/virtualrouter
virtualrouter.serviceFile=${zstack_build_root}/zsvirt-utility/virtualrouter/zstack-virtualrouter

setting.source=${zstack_build_root}/zsvirt-utility/setting
setting.serviceFile=${zstack_build_root}/zsvirt-utility/setting/zstack-setting

zstackCommons.source=${zstack_build_root}/zsvirt-utility/puppets/

testagent.source=${zstack_build_root}/zstack-woodpecker/zstacktestagent
testagent.serviceFile=${zstack_build_root}/zstack-woodpecker/zstacktestagent/zstack-testagent

zstacktestproperties.source=${zstack_build_root}/zstack-woodpecker/conf

consoleproxy.source=${zstack_build_root}/zsvirt-utility/consoleproxy
consoleproxy.serviceFile=${zstack_build_root}/zsvirt-utility/consoleproxy/zstack-consoleproxy

zstackctl.source=${zstack_build_root}/zsvirt-utility/zstackctl

iscsi.source=${zstack_build_root}/zsvirt-utility/iscsifilesystemagent
iscsi.serviceFile=${zstack_build_root}/zsvirt-utility/iscsifilesystemagent/zstack-iscsi

cephb.source=${zstack_build_root}/zsvirt-utility/cephbackupstorage
cephb.serviceFile=${zstack_build_root}/zsvirt-utility/cephbackupstorage/zstack-ceph-backupstorage

cephp.source=${zstack_build_root}/zsvirt-utility/cephprimarystorage
cephp.serviceFile=${zstack_build_root}/zsvirt-utility/cephprimarystorage/zstack-ceph-primarystorage

zbsp.source=${zstack_build_root}/zsvirt-utility/zbsprimarystorage
zbsp.serviceFile=${zstack_build_root}/zsvirt-utility/zbsprimarystorage/zstack-zbs-primarystorage

create.pypi.source=${zstackbuild.scripts}/create_pypi_source.sh
patch.pypi.source=${zstackbuild.scripts}/pypi_source_patch.sh
create.virtualenv=${zstackbuild.scripts}/create_virtualenv.sh
gen.product.title.script=${zstackbuild.scripts}/gen_installation_title.sh
offline.bin.gen.setup.script=${zstack_build_root}/zsvirt-utility/zstackbuild/scripts/gen_setup.sh
offline.bin.setup.script=${zstack_build_root}/zsvirt-utility/zstackbuild/scripts/setup.sh
build.installation.bin.script=${zstack_build_root}/zsvirt-utility/zstackbuild/scripts/build_installation_bin.sh
pip2pi.requirements.file=${zstack_build_root}/zsvirt-utility/zstackbuild/pypi_source/requirements.txt
pypi.source.folder=${zstack_build_root}/zsvirt-utility/zstackbuild/pypi_source/pypi
pyapis.source.folder=${zstack_build_root}/zsvirt-utility/apibinding/apibinding
remove.pypi.symlink=${zstack_build_root}/zsvirt-utility/zstackbuild/scripts/remove_pypi_symlink.sh

centos6.repo.dir=${zstack_build_root}/zsvirt-utility/zstackbuild/centos6_repo
centos7.repo.dir=${zstack_build_root}/zsvirt-utility/zstackbuild/centos7_repo
centos6.unzip.rpm=${zstack_build_root}/zsvirt-utility/zstackbuild/libs/unzip-6.0-2.el6_6.x86_64.rpm
centos7.unzip.rpm=${zstack_build_root}/zsvirt-utility/zstackbuild/libs/unzip-6.0-15.el7.x86_64.rpm
centos7.unzip.aarch64.rpm=${zstack_build_root}/zsvirt-utility/zstackbuild/libs/unzip-6.0-16.el7.aarch64.rpm
tomcat.root.app.zip=${zstack_build_root}/zsvirt-utility/zstackbuild/libs/tomcat_root_app.zip

imagestorebackupstorage.source=${zstack_build_root}/zsvirt-utility/imagestorebackupstorage

# Commercial components (same layout as build.properties; sibling repos under zstack_build_root)
mevocoui.source=${zstack_build_root}/mevoco-ui

agent.source=${zstack_build_root}/zstack-agent
agent.server.yaml=${agent.source}/target/package/server/agent.yaml
agent.server.bin=${agent.source}/target/zstack-agent.bin
agent.collectd.yaml=${agent.source}/target/package/collectd/collectd.yaml
agent.collectd.bin=${agent.source}/target/collectd.bin

imagestore.source=${zstack_build_root}/zstack-store
imagestore.bin=${imagestore.source}/target/package/zstore/zstack-store.bin
imagestore.goroot=/usr/lib/golang1.18/
imagestore.arch=amd64 arm64 mips64le loong64

vyos.source=${zstack_build_root}/zstack-vyos
vyos.goroot=/usr/lib/golang1.18
vyos.arch=amd64 arm64 loong64

zstacknetwork.source=${zstack_build_root}/zstack-network
zstacknetwork.goroot=/usr/lib/golang
zstacknetwork.arch=
zsnansibleplaybook.source=${zstack_build_root}/zsvirt-utility/zstacknetwork

zstackzwatch.source=${zstack_build_root}/zstack-zwatch
zstackzwatch.goroot=/usr/lib/golang1.18
zstackzwatch.arch=amd64 arm64 freebsd_amd64 loong64
agent.version.generator=${zstack_build_root}/zsvirt-utility/zstackbuild/scripts/agnet_version_generator_py2.py

zstacksharedblock.source=${zstack_build_root}/zstack-sharedblock
zstacksharedblock.goroot=/usr/lib/golang1.18
zstacksharedblock.arch=amd64 arm64 mips64le loong64
zsblkansibleplaybook.source=${zstack_build_root}/zsvirt-utility/zstacksharedblock

baremetalpxeserver.source=${zstack_build_root}/zsvirt-utility/baremetalpxeserver
baremetalpxeserver.serviceFile=${zstack_build_root}/zsvirt-utility/baremetalpxeserver/zstack-baremetalpxeserver

build.zstack.war.script=${zstackbuild.scripts}/build_zstack_war.sh
build.premium.war.script=${zstackbuild.scripts}/build_premium_war.sh
build.zstack.pyapis.script=${zstackbuild.scripts}/build_zstack_py_apis.sh
build.zstack.pysdk.script=${zstackbuild.scripts}/build_zstack_pysdk.sh
build.zsha2.script=${zstackbuild.scripts}/build_zsha2.sh

promtailansibleplaybook.source=${zstack_build_root}/zsvirt-utility/promtail
guesttoolsansibleplaybook.source=${zstack_build_root}/zsvirt-utility/guesttools
transmissionansibleplaybook.source=${zstack_build_root}/zsvirt-utility/transmission
